    <section class="sign">

            <div>

                    <label for="">Tell us your name*</label><br>
                    <input type="text" placeholder="Enter your name" class="sign__inp">
                </div>
                <div>
                    <label for="">Enter your email*</label><br>
                    <input type="email" placeholder="Enter your email" class="sign__inp sign__inp2"><br>
                </div>
            </div>
            <div class="sign__phone">
                <div>
                    <label for="">Tell us your phone</label><br>
                    <input type="text" placeholder="Enter your phone" class="sign__inp1"><br>
                </div>
                <div class="sign__phone">
                    <label for="" class="">Message</label><br>
                    <textarea name="" id="textarea" placeholder="Your message here..." class="sign__inp3"></textarea>
                </div>
            </div>

            <button class="sign__btn">SUBMIT</button>

        </form>
        </div>
        <div>
        <table border="1" class="table" >
            <thead class="thead">
                <tr>
                    <th>№</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone Number</th>
                    <th>Message</td>
                </tr>
            </thead>
            <tbody>
                
            </tbody>
        </table>
        </div>
    </section>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .rect{
            width: 300px;
            height: 300px;
            border: 5px solid;
            margin:  0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .circle{
            width: 70%;
            height: 70%;
            border: 5px solid;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }
        .circle div{
            width: 20px;
            height: 20px;
            border: 5px solid ;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="rect">
        <div class="circle">
            <div></div>
            <div></div>
        </div>
    </div>
    
</body>
</html>
